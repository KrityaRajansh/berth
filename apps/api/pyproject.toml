[project]
name = "berth-api"
version = "0.1.0"
description = "REST API for the Berth train reservation system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "qrcode>=8.2",
    "reportlab>=5.0.1",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdf>=6.20.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.uv]
# Only resolve package versions published at least two weeks before this date.
exclude-newer = "2026-10-12T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: needs a PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
skip_empty = true
