<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <style>
    .dev { fill: #eef4fb; stroke: #1f4e8c; stroke-width: 1.2; }
    .test { fill: #ffffff; stroke: #1f4e8c; stroke-width: 1.2; }
    .title { font-size: 13px; font-weight: 600; fill: #0f2747; }
    .sub { font-size: 11px; fill: #555; }
    .flow { stroke: #4a4a4a; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    .pair { stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 4 4; }
    .cap { font-size: 11px; fill: #555; font-style: italic; }
  </style>

  <text x="135" y="14" class="cap" text-anchor="middle">Specification and design</text>
  <text x="585" y="14" class="cap" text-anchor="middle">Testing</text>

  <rect x="20" y="22" width="230" height="48" rx="6" class="dev"/>
  <text x="34" y="42" class="title">Requirements</text>
  <text x="34" y="59" class="sub">SRS: FR, NFR, business rules</text>

  <rect x="70" y="92" width="230" height="48" rx="6" class="dev"/>
  <text x="84" y="112" class="title">System design</text>
  <text x="84" y="129" class="sub">SDD: architecture, deployment</text>

  <rect x="120" y="162" width="230" height="48" rx="6" class="dev"/>
  <text x="134" y="182" class="title">Module design</text>
  <text x="134" y="199" class="sub">SDD: classes, sequences, states</text>

  <rect x="245" y="236" width="230" height="48" rx="6" class="dev"/>
  <text x="360" y="256" class="title" text-anchor="middle">Implementation</text>
  <text x="360" y="273" class="sub" text-anchor="middle">FastAPI, React, PostgreSQL</text>

  <rect x="470" y="22" width="230" height="48" rx="6" class="test"/>
  <text x="484" y="42" class="title">Acceptance testing</text>
  <text x="484" y="59" class="sub">AT-01 to AT-08, user scenarios</text>

  <rect x="420" y="92" width="230" height="48" rx="6" class="test"/>
  <text x="434" y="112" class="title">System testing</text>
  <text x="434" y="129" class="sub">ST-01 to ST-15, browser and NFRs</text>

  <rect x="370" y="162" width="230" height="48" rx="6" class="test"/>
  <text x="384" y="182" class="title">Integration testing</text>
  <text x="384" y="199" class="sub">IT-01 to IT-36, API and database</text>

  <text x="360" y="226" class="cap" text-anchor="middle">Unit testing UT-01 to UT-24</text>

  <path d="M135 70 L170 92" class="flow"/>
  <path d="M185 140 L220 162" class="flow"/>
  <path d="M245 210 L300 236" class="flow"/>
  <path d="M420 236 L475 210" class="flow"/>
  <path d="M500 162 L535 140" class="flow"/>
  <path d="M550 92 L585 70" class="flow"/>

  <line x1="250" y1="46" x2="470" y2="46" class="pair"/>
  <line x1="300" y1="116" x2="420" y2="116" class="pair"/>
  <line x1="350" y1="186" x2="370" y2="186" class="pair"/>
</svg>
